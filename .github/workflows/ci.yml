name: CI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules-hinweis:
    # Reiner Hinweis, schlägt nie fehl. Regeln werden erst nach dem Merge deployt
    # (Job firestore-rules in main.yml, vor dem Website-Release); wer den Hinweis
    # im PR sieht, weiß vorher, dass der Merge sie in Produktion bringt.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Auf Änderungen an firestore.rules hinweisen
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMMER: ${{ github.event.pull_request.number }}
        run: |
          # Über die API statt über einen Checkout: der Job braucht sonst nichts
          # aus dem Repository.
          dateien=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMMER/files" \
            --paginate --jq '.[].filename')
          if ! grep -qx 'firestore.rules' <<< "$dateien"; then
            echo "firestore.rules unverändert – nichts zu tun."
            exit 0
          fi
          echo "::notice file=firestore.rules::Dieser PR ändert firestore.rules. Nach dem Merge deployt der Job 'firestore-rules' in main.yml die Regeln, bevor die Website live geht — schlägt er fehl, bleibt auch die Website zurück, bis ein manuelles 'npm run rules:deploy' gelaufen ist."
          {
            echo "### Dieser PR ändert \`firestore.rules\`"
            echo ""
            echo "Nach dem Merge deployt der Job \`firestore-rules\` in \`main.yml\` die Regeln,"
            echo "bevor die Website ausgeliefert wird."
            echo ""
            echo "Schlägt der Job fehl (z. B. weil das Secret \`FIREBASE_SERVICE_ACCOUNT\` fehlt),"
            echo "bleiben Regeln und Website auf dem alten Stand, bis das hier lief:"
            echo ""
            echo '```bash'
            echo "npm run rules:deploy"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  firestore-rules-emulator:
    # Spielt firestore.rules im Firestore-Emulator gegen Dokumente durch, wie
    # die Anwendung sie wirklich schreibt – samt Reserve unter dem Limit von
    # 1000 Ausdrücken je Anfrage (ADR 0008). Kein Required Check (ADR 0001),
    # aber rot, sobald eine Regeländerung Produktion das Speichern verbieten würde.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Java (Firestore-Emulator)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Regeln im Emulator prüfen
        run: npm run rules:test

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Vollständige Historie: der Build leitet sitemap-lastmod und
          # schema.org/dateModified je Seite aus dem letzten inhaltlichen Commit
          # ab. Bei fetch-depth 1 existiert nur der Tip-Commit, dann tragen alle
          # Seiten dasselbe Datum (AP-03).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Ensure firebase-config.js exists for tests
        run: cp src/firebase-config.template.js src/firebase-config.js

      - name: Lint
        run: npm run lint

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build project
        run: npm run build

      - name: Check internal links
        run: npm run links:check

      - name: Check content quality
        run: npm run content:check

      - name: Check performance budget
        run: npm run perf:budget

      - name: Upload unit test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN || vars.CODECOV_TOKEN }}
          files: test-results/junit.xml
          flags: unit,pr
          fail_ci_if_error: false

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN || vars.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit,pr
          fail_ci_if_error: false

  e2e-smoke-routing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Vollständige Historie: der Build leitet sitemap-lastmod und
          # schema.org/dateModified je Seite aus dem letzten inhaltlichen Commit
          # ab. Bei fetch-depth 1 existiert nur der Tip-Commit, dann tragen alle
          # Seiten dasselbe Datum (AP-03).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Ensure firebase-config.js exists for app build
        run: cp src/firebase-config.template.js src/firebase-config.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e smoke + routing
        run: npx playwright test -g "@smoke|@routing"

      - name: Upload e2e test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN || vars.CODECOV_TOKEN }}
          files: test-results/e2e-junit.xml
          flags: e2e,smoke,routing,pr
          fail_ci_if_error: false
