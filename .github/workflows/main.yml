# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    # Der wöchentliche Rang-Snapshot (seo-snapshot.yml) committet nach seo/.
    # Diese Dateien landen nicht in dist/, ein Deploy wäre folgenlos.
    paths-ignore:
      - 'seo/**'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Vollständige Historie: der Build leitet sitemap-lastmod und
          # schema.org/dateModified je Seite aus dem letzten inhaltlichen Commit
          # ab. Bei fetch-depth 1 existiert nur der Tip-Commit, dann tragen alle
          # Seiten dasselbe Datum (AP-03).
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'src/**'
              - 'e2e/**'
              - 'playwright.config.ts'
              - 'package.json'
              - 'package-lock.json'
              - 'rollup.config.js'
              - '.github/workflows/main.yml'

  e2e-matrix:
    needs: changes
    if: ${{ needs.changes.outputs.run_e2e == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, generator, admin, teilnehmer, uebungsleitung, routing, seo]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Vollständige Historie: der Build leitet sitemap-lastmod und
          # schema.org/dateModified je Seite aus dem letzten inhaltlichen Commit
          # ab. Bei fetch-depth 1 existiert nur der Tip-Commit, dann tragen alle
          # Seiten dasselbe Datum (AP-03).
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate firebase-config.js from secrets
        run: |
          mkdir -p src
          cat src/firebase-config.template.js | \
          sed "s|\${FIREBASE_API_KEY}|${{ secrets.FIREBASE_API_KEY }}|g" | \
          sed "s|\${FIREBASE_AUTH_DOMAIN}|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" | \
          sed "s|\${FIREBASE_PROJECT_ID}|${{ secrets.FIREBASE_PROJECT_ID }}|g" | \
          sed "s|\${FIREBASE_STORAGE_BUCKET}|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" | \
          sed "s|\${FIREBASE_MESSAGING_SENDER_ID}|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" | \
          sed "s|\${FIREBASE_APP_ID}|${{ secrets.FIREBASE_APP_ID }}|g" | \
          sed "s|\${FIREBASE_MEASUREMENT_ID}|${{ secrets.FIREBASE_MEASUREMENT_ID }}|g" \
          > src/firebase-config.js

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run e2e suite (${{ matrix.suite }})
        run: npm run test:e2e:${{ matrix.suite }}

      - name: Upload e2e test results to Codecov (${{ matrix.suite }})
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN || vars.CODECOV_TOKEN }}
          files: test-results/e2e-junit.xml
          flags: e2e,${{ matrix.suite }}
          fail_ci_if_error: false

      - name: Upload e2e artifacts (${{ matrix.suite }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.suite }}-artifacts
          path: |
            test-results
            playwright-report
          if-no-files-found: ignore

  firestore-rules:
    # Die Firestore-Regeln sind Teil des Deployments (ADR 0008): Sie gehen bei
    # jedem Push auf main nach Firebase, und zwar bevor die Website live geht,
    # damit ein neuer Stand von dist/ nie auf alte Regeln trifft. Der Deploy ist
    # idempotent; die CLI räumt alte Regelversionen an der Quote selbst ab.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Kein npm ci: der Deploy braucht keine Projekt-Abhängigkeiten, nur die
      # Firebase-CLI, die `npm run rules:deploy` per npx zieht.

      - name: Secret prüfen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            exit 0
          fi
          # Bewusst ein Fehlschlag statt eines stillen Skips: Ohne Regeln kein
          # Website-Deploy. Ein grüner, übersprungener Job sähe exakt so aus wie
          # die Lücke, die dieser Job schließen soll.
          {
            echo "### Firestore-Regeln NICHT deployt – Website-Deploy angehalten"
            echo ""
            echo "Das Repository-Secret \`FIREBASE_SERVICE_ACCOUNT\` fehlt."
            echo "Produktion arbeitet weiter mit den alten Regeln und der alten Website."
            echo ""
            echo "Jetzt lokal nachholen und den Workflow erneut starten:"
            echo ""
            echo '\`\`\`bash'
            echo "npm run rules:deploy"
            echo '\`\`\`'
            echo ""
            echo "Dauerhaft lösen: docs/entwicklung.md, Abschnitt „Firestore-Regeln deployen“."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error file=firestore.rules::Regel-Deploy ohne Zugangsdaten: Secret FIREBASE_SERVICE_ACCOUNT fehlt (Repository-Secret, nicht Environment — die FIREBASE_*-Werte im Environment github-pages sind Web-Konfiguration und hier nicht sichtbar). Bis zum manuellen 'npm run rules:deploy' gelten in Produktion die alten Regeln; die Website wird nicht ausgeliefert."
          exit 1

      - name: Zugangsdaten bereitstellen
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          schluessel="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$schluessel"
          chmod 600 "$schluessel"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$schluessel" >> "$GITHUB_ENV"

      - name: Regeln deployen
        run: npm run rules:deploy

      - name: Zugangsdaten entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

      - name: Ergebnis vermerken
        run: |
          {
            echo "### Firestore-Regeln deployt"
            echo ""
            echo "\`firestore.rules\` aus \`${GITHUB_SHA:0:7}\` ist in Produktion aktiv."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    # Erst die Regeln, dann die Website: ohne grünen firestore-rules-Job kein Release.
    needs: [changes, e2e-matrix, firestore-rules]
    if: ${{ !cancelled() && needs.firestore-rules.result == 'success' && (((needs.changes.outputs.run_e2e == 'true' || github.event_name == 'workflow_dispatch') && needs.e2e-matrix.result == 'success') || (needs.changes.outputs.run_e2e != 'true' && github.event_name != 'workflow_dispatch')) }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Vollständige Historie: postbuild-copy.mjs liest je Seite das Datum des
          # letzten Commits für sitemap-lastmod und schema.org/dateModified. Mit
          # dem Standard fetch-depth 1 existiert nur der Tip-Commit – dann bekommen
          # ALLE Seiten das Deploy-Datum statt ihres echten Änderungsdatums.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate firebase-config.js from secrets
        run: |
          mkdir -p src
          cat src/firebase-config.template.js | \
          sed "s|\${FIREBASE_API_KEY}|${{ secrets.FIREBASE_API_KEY }}|g" | \
          sed "s|\${FIREBASE_AUTH_DOMAIN}|${{ secrets.FIREBASE_AUTH_DOMAIN }}|g" | \
          sed "s|\${FIREBASE_PROJECT_ID}|${{ secrets.FIREBASE_PROJECT_ID }}|g" | \
          sed "s|\${FIREBASE_STORAGE_BUCKET}|${{ secrets.FIREBASE_STORAGE_BUCKET }}|g" | \
          sed "s|\${FIREBASE_MESSAGING_SENDER_ID}|${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}|g" | \
          sed "s|\${FIREBASE_APP_ID}|${{ secrets.FIREBASE_APP_ID }}|g" | \
          sed "s|\${FIREBASE_MEASUREMENT_ID}|${{ secrets.FIREBASE_MEASUREMENT_ID }}|g" \
          > src/firebase-config.js

      - name: Update coverage report link in README
        run: npm run coverage:readme

      - name: Run lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN || vars.CODECOV_TOKEN }}
          files: test-results/junit.xml
          fail_ci_if_error: false

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN || vars.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: unit
          name: unit-coverage
          fail_ci_if_error: false
      
      - name: Build project
        run: npm run build

      - name: Check internal links
        run: npm run links:check

      - name: Check content quality
        run: npm run content:check

      - name: Check performance budget
        run: npm run perf:budget

      - name: Create build.json with commit SHA and run number
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_TIME=$(date +%H%M%S)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_NR=${{ github.run_number }}
          echo "📦 Generiere build.json"
          echo "{\"buildDate\":\"$BUILD_DATE\",\"buildTime\":\"$BUILD_TIME\",\"commit\":\"$COMMIT_SHA\",\"runNumber\":$BUILD_NR}" > dist/build.json

      - name: Copy coverage report into dist
        run: |
          mkdir -p dist/coverage
          cp -r coverage/* dist/coverage/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'dist'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage/index.html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      
      - name: Set Version Tag
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          BUILD_TIME=$(date +%H%M%S)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          BUILD_NR=${{ github.run_number }}
          TAG_NAME="v${BUILD_DATE}-${BUILD_NR}-${COMMIT_SHA}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $TAG_NAME
          git push origin $TAG_NAME
